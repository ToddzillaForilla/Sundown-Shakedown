<!doctype html><html><meta charset="utf-8"><title>Kristen kick pilot</title><style>body{background:#17202b;color:#eee;font:18px system-ui;margin:24px}canvas{background:#263342;image-rendering:pixelated}button,select{font:inherit;margin:10px}section{display:flex;gap:20px;flex-wrap:wrap}img{image-rendering:pixelated}</style><h1>Kristen — kick pilot</h1><p>Source review only. 8 generations. Current idle reference at left; candidate at right. Both at native pixel scale.</p><button id="pause">Pause</button><select id="speed"><option value="12">12 fps</option><option value="4">4 fps slow</option><option value="33">33 fps combat preview</option></select><button id="flip">Reverse facing</button><button id="step">Next frame</button><p id="label"></p><section><canvas id="ref" width="256" height="256"></canvas><canvas id="clip" width="256" height="256"></canvas></section><p>Check leftward extension, planted support foot, proportions, and return to guard. Preview rate does not change combat timing.</p><img src="kick-contact.png" width="768"><script>const frames=Array.from({length:9},(_,i)=>{const im=new Image();im.src='kick-'+i+'.png';return im});const idle=new Image();idle.src='../retro-animation-pilot-20261015/idle-0.png';let playing=true,flipped=false,frame=0,last=0;const draw=(id,im)=>{const c=document.getElementById(id).getContext('2d');c.clearRect(0,0,256,256);c.strokeStyle='#91a68e';c.beginPath();c.moveTo(0,251.5);c.lineTo(256,251.5);c.stroke();c.save();if(flipped){c.translate(256,0);c.scale(-1,1)}if(im.complete&&im.naturalWidth)c.drawImage(im,0,0);c.restore()};document.getElementById('pause').onclick=()=>playing=!playing;document.getElementById('flip').onclick=()=>flipped=!flipped;document.getElementById('step').onclick=()=>{playing=false;frame=(frame+1)%frames.length};function tick(t){if(playing&&t-last>1000/Number(document.getElementById('speed').value)){frame=(frame+1)%frames.length;last=t}draw('ref',idle);draw('clip',frames[frame]);document.getElementById('label').textContent='Frame '+frame;requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></html>
