<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#3b0710" />
      <stop offset="0.58" stop-color="#120207" />
      <stop offset="1" stop-color="#020102" />
    </radialGradient>
    <linearGradient id="letters" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd11a" />
      <stop offset="1" stop-color="#ff9f00" />
    </linearGradient>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="2" fill="#5c1d75" opacity="0.14" />
