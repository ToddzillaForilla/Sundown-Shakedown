  <rect width="512" height="512" fill="url(#backdrop)" />
  <circle cx="256" cy="248" r="198" fill="none" stroke="#6e101b" stroke-width="3" opacity="0.72" />
  <circle cx="256" cy="248" r="182" fill="none" stroke="#d31a16" stroke-width="2" opacity="0.28" />

