    <text x="264" y="231" font-size="92" textLength="360" lengthAdjust="spacingAndGlyphs" fill="#230005" stroke="#230005" stroke-width="19">SUNDOWN</text>
    <text x="264" y="319" font-size="82" textLength="382" lengthAdjust="spacingAndGlyphs" fill="#230005" stroke="#230005" stroke-width="19">SHAKEDOWN</text>
    <text x="256" y="221" font-size="92" textLength="360" lengthAdjust="spacingAndGlyphs" fill="url(#letters)" stroke="#d31a16" stroke-width="11" paint-order="stroke fill">SUNDOWN</text>
    <text x="256" y="309" font-size="82" textLength="382" lengthAdjust="spacingAndGlyphs" fill="url(#letters)" stroke="#d31a16" stroke-width="11" paint-order="stroke fill">SHAKEDOWN</text>
  </g>

  <rect width="512" height="512" fill="url(#scanlines)" />
